name: Frozen specification integrity

on:
  push:
    branches: [main, "experiment/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify-documentary-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check immutable v0.1.1 reference hashes
        run: python3 scripts/verify_freeze.py
